#
# SevenOS public installer user policy.
#
# The goal is to keep the install path approachable: the user must choose a
# password, but Calamares must not force a complex or long password at install
# time. SevenOS still keeps sudo/root authentication active after install.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - input
    - uucp
    - name: nopasswdlogin
      must_exist: false
      system: true

sudoersGroup: wheel
autologinGroup: autologin
sudoersConfigureWithGroup: false

setRootPassword: true
doReusePassword: false

displayAutologin: false
doAutologin: false

# SevenOS accepts any non-empty password from the graphical installer.
# This keeps the public install accessible while still preventing a blank
# account password.
passwordRequirements:
    minLength: 1
    maxLength: -1

# Keep weak-password choice available and enabled by default. This prevents
# libpwquality-style strength checks from blocking short/simple passwords.
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [ root, nobody ]
  home_permissions: "o700"
  nopasswd_group: "nopasswdlogin"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "sevenos-${login}"
  forbidden_names: [ localhost ]

allowActiveDirectory: false

presets:
    fullName:
        editable: true
    loginName:
        editable: true
