---
dontChroot: false
timeout: 60
verbose: true

script:
  - command: >-
      /bin/bash -lc 'set -Eeuo pipefail;
      log(){ printf "[SevenOS Calamares cleanup] %s\n" "$*" | tee -a /var/log/sevenos-install.log; };
      mkdir -p /var/log;
      log "starting installed-root live cleanup";
      for candidate in /usr/local/bin/seven-calamares-livecleanup /opt/SevenOS/bin/seven-calamares-livecleanup /usr/share/sevenos/bin/seven-calamares-livecleanup /SevenOS/bin/seven-calamares-livecleanup; do
        if [ -f "$candidate" ]; then
          log "running $candidate";
          /bin/bash "$candidate" || log "WARN: live cleanup returned a non-zero status; continuing";
          exit 0;
        fi;
      done;
      log "WARN: SevenOS live cleanup helper was not found; continuing";
      exit 0'
    timeout: 120

i18n:
  name: "Preparing SevenOS user environment"
  name[fr]: "Préparation de l'environnement utilisateur SevenOS"
