---
dontChroot: false
timeout: 60
verbose: true

script:
  - command: "/bin/bash -lc 'set +e; log=/var/log/sevenos-install.log; mkdir -p \"$(dirname \"$log\")\" 2>/dev/null || true; for hook in /usr/local/bin/seven-calamares-livecleanup /opt/SevenOS/bin/seven-calamares-livecleanup; do if [ -f \"$hook\" ]; then chmod +x \"$hook\" 2>/dev/null || true; echo \"SevenOS live cleanup: $hook\" | tee -a \"$log\"; /bin/bash \"$hook\"; status=$?; if [ \"$status\" -ne 0 ]; then echo \"WARN: SevenOS live cleanup returned $status; finalizer will continue cleanup later\" | tee -a \"$log\"; fi; exit 0; fi; done; echo \"WARN: SevenOS live cleanup hook missing; finalizer will continue cleanup later\" | tee -a \"$log\"; exit 0'"
    timeout: 120

i18n:
  name: "Preparing SevenOS user environment"
  name[fr]: "Préparation de l'environnement utilisateur SevenOS"
