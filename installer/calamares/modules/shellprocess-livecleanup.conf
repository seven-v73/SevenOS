---
dontChroot: false
timeout: 60
verbose: true

script:
  - command: >-
      /bin/bash -lc 'set -Eeuo pipefail;
      mkdir -p /var/log;
      echo "[SevenOS Calamares cleanup] starting installed-root live cleanup" | tee -a /var/log/sevenos-install.log;
      if [ -f /usr/local/bin/seven-calamares-livecleanup ]; then
        echo "[SevenOS Calamares cleanup] running /usr/local/bin/seven-calamares-livecleanup" | tee -a /var/log/sevenos-install.log;
        /bin/bash /usr/local/bin/seven-calamares-livecleanup || echo "[SevenOS Calamares cleanup] WARN: live cleanup returned a non-zero status; continuing" | tee -a /var/log/sevenos-install.log;
        exit 0;
      fi;
      if [ -f /opt/SevenOS/bin/seven-calamares-livecleanup ]; then
        echo "[SevenOS Calamares cleanup] running /opt/SevenOS/bin/seven-calamares-livecleanup" | tee -a /var/log/sevenos-install.log;
        /bin/bash /opt/SevenOS/bin/seven-calamares-livecleanup || echo "[SevenOS Calamares cleanup] WARN: live cleanup returned a non-zero status; continuing" | tee -a /var/log/sevenos-install.log;
        exit 0;
      fi;
      if [ -f /usr/share/sevenos/bin/seven-calamares-livecleanup ]; then
        echo "[SevenOS Calamares cleanup] running /usr/share/sevenos/bin/seven-calamares-livecleanup" | tee -a /var/log/sevenos-install.log;
        /bin/bash /usr/share/sevenos/bin/seven-calamares-livecleanup || echo "[SevenOS Calamares cleanup] WARN: live cleanup returned a non-zero status; continuing" | tee -a /var/log/sevenos-install.log;
        exit 0;
      fi;
      if [ -f /SevenOS/bin/seven-calamares-livecleanup ]; then
        echo "[SevenOS Calamares cleanup] running /SevenOS/bin/seven-calamares-livecleanup" | tee -a /var/log/sevenos-install.log;
        /bin/bash /SevenOS/bin/seven-calamares-livecleanup || echo "[SevenOS Calamares cleanup] WARN: live cleanup returned a non-zero status; continuing" | tee -a /var/log/sevenos-install.log;
        exit 0;
      fi;
      echo "[SevenOS Calamares cleanup] WARN: SevenOS live cleanup helper was not found; continuing" | tee -a /var/log/sevenos-install.log;
      exit 0'
    timeout: 120

i18n:
  name: "Preparing SevenOS user environment"
  name[fr]: "Préparation de l'environnement utilisateur SevenOS"
