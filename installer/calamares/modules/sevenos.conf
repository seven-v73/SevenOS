# SevenOS Calamares post-install module scaffold
#
# Intended behavior once Calamares is packaged into the live ISO:
# - copy /opt/SevenOS into the target system
# - run SevenOS base setup inside chroot
# - install CLI, hub, theme and post-install checks
#
# This is a configuration marker for the SevenOS architecture gate. The real
# Calamares module script should stay conservative and explicit.

script:
  - command: >-
      /bin/bash -lc 'set -Eeuo pipefail;
      mkdir -p /var/log;
      echo "[SevenOS Calamares finalizer] starting installed-root finalization" | tee -a /var/log/sevenos-install.log;
      if [ -f /usr/local/bin/seven-calamares-finalize ]; then
        echo "[SevenOS Calamares finalizer] running /usr/local/bin/seven-calamares-finalize" | tee -a /var/log/sevenos-install.log;
        exec /bin/bash /usr/local/bin/seven-calamares-finalize;
      fi;
      if [ -f /opt/SevenOS/bin/seven-calamares-finalize ]; then
        echo "[SevenOS Calamares finalizer] running /opt/SevenOS/bin/seven-calamares-finalize" | tee -a /var/log/sevenos-install.log;
        exec /bin/bash /opt/SevenOS/bin/seven-calamares-finalize;
      fi;
      if [ -f /usr/share/sevenos/bin/seven-calamares-finalize ]; then
        echo "[SevenOS Calamares finalizer] running /usr/share/sevenos/bin/seven-calamares-finalize" | tee -a /var/log/sevenos-install.log;
        exec /bin/bash /usr/share/sevenos/bin/seven-calamares-finalize;
      fi;
      if [ -f /SevenOS/bin/seven-calamares-finalize ]; then
        echo "[SevenOS Calamares finalizer] running /SevenOS/bin/seven-calamares-finalize" | tee -a /var/log/sevenos-install.log;
        exec /bin/bash /SevenOS/bin/seven-calamares-finalize;
      fi;
      echo "[SevenOS Calamares finalizer] ERROR: SevenOS finalizer was not found in the installed root" | tee -a /var/log/sevenos-install.log;
      echo "[SevenOS Calamares finalizer] Checked /usr/local/bin, /opt/SevenOS, /usr/share/sevenos and /SevenOS" | tee -a /var/log/sevenos-install.log;
      echo "[SevenOS Calamares finalizer] The unpackfs step did not copy the expected SevenOS files into the target" | tee -a /var/log/sevenos-install.log;
      exit 127'
    timeout: 2400
