# SevenOS Calamares post-install hook
#
# Calamares ships a standard shellprocess module. SevenOS uses that module
# instead of a custom, distro-local module name so the graphical installer can
# run on a fresh ISO without requiring extra Python plugin packaging.
---
dontChroot: false
timeout: 2400
verbose: true

script:
  - command: "/bin/bash -lc 'set -u; for hook in /usr/local/bin/seven-calamares-finalize /opt/SevenOS/bin/seven-calamares-finalize; do if [ -f \"$hook\" ]; then chmod +x \"$hook\" 2>/dev/null || true; echo \"SevenOS finalizer: $hook\"; exec /bin/bash \"$hook\"; fi; done; echo \"SevenOS finalizer missing in installed root\" >&2; exit 127'"
    timeout: 2400

i18n:
  name: "Finalize SevenOS"
  name[fr]: "Finaliser SevenOS"
