# SevenOS Calamares post-install hook
#
# Calamares ships a standard shellprocess module. SevenOS uses that module
# instead of a custom, distro-local module name so the graphical installer can
# run on a fresh ISO without requiring extra Python plugin packaging.
---
dontChroot: false
timeout: 2400
verbose: true

script:
  - command: >-
      /bin/bash -lc 'set -Eeuo pipefail;
      log(){ printf "[SevenOS Calamares finalizer] %s\n" "$*" | tee -a /var/log/sevenos-install.log; };
      mkdir -p /var/log;
      log "starting installed-root finalization";
      for candidate in /usr/local/bin/seven-calamares-finalize /opt/SevenOS/bin/seven-calamares-finalize /usr/share/sevenos/bin/seven-calamares-finalize /SevenOS/bin/seven-calamares-finalize; do
        if [ -f "$candidate" ]; then
          log "running $candidate";
          exec /bin/bash "$candidate";
        fi;
      done;
      log "ERROR: SevenOS finalizer was not found in the installed root";
      log "Checked /usr/local/bin, /opt/SevenOS, /usr/share/sevenos and /SevenOS";
      log "The unpackfs step did not copy the expected SevenOS files into the target";
      exit 127'
    timeout: 2400

i18n:
  name: "Finalize SevenOS"
  name[fr]: "Finaliser SevenOS"
