# SevenOS public ISO GRUB menu.
#
# Keep this file plain and readable. Some machines reach GRUB instead of the
# systemd-boot path, and a missing or theme-heavy GRUB menu looks like an empty
# boot screen.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod gfxterm

set color_normal=white/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/white
set timeout_color=white/black
set term_background=black

if loadfont "${prefix}/fonts/unicode.pf2"; then
    terminal_input console
    terminal_output gfxterm
else
    terminal_input console
    terminal_output console
fi

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

set default=0
set timeout=20
set timeout_style=menu
set pager=1

menuentry "SevenOS Live (%ARCH%, ${archiso_platform})" --id 'sevenos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=0 rd.systemd.show_status=false systemd.show_status=false systemd.log_level=err rd.udev.log_level=0 udev.log_priority=0 vt.global_cursor_default=0 plymouth.ignore-serial-consoles nvidia_drm.modeset=1 ibt=off systemd.gpt_auto=0 rd.systemd.gpt_auto=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SevenOS Live - Safe Graphics (%ARCH%, ${archiso_platform})" --id 'sevenos-safe' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nvidia_drm.modeset=1 nouveau.modeset=1 i915.modeset=1 amdgpu.dc=1 ibt=off loglevel=4 systemd.show_status=true vt.global_cursor_default=1 systemd.gpt_auto=0 rd.systemd.gpt_auto=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SevenOS Live - Speech (%ARCH%, ${archiso_platform})" --id 'sevenos-speech' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on loglevel=4 rd.udev.log_level=4 systemd.show_status=true vt.global_cursor_default=1 nvidia_drm.modeset=1 ibt=off systemd.gpt_auto=0 rd.systemd.gpt_auto=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Restart' --id 'restart' {
    reboot
}

menuentry 'Power Off' --id 'poweroff' {
    halt
}
