# SevenOS GRUB loopback boot support.

search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

set color_normal=white/black
set color_highlight=black/white
set menu_color_normal=white/black
set menu_color_highlight=black/white
set timeout_color=white/black

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

set default=0
set timeout=20
set timeout_style=menu

menuentry "SevenOS Live (%ARCH%, ${archiso_platform})" --id 'sevenos' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" quiet splash loglevel=0 rd.systemd.show_status=false systemd.show_status=false systemd.log_level=err rd.udev.log_level=0 udev.log_priority=0 vt.global_cursor_default=0 plymouth.ignore-serial-consoles nvidia_drm.modeset=1 ibt=off systemd.gpt_auto=0 rd.systemd.gpt_auto=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "SevenOS Live - Safe Graphics (%ARCH%, ${archiso_platform})" --id 'sevenos-safe' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" nvidia_drm.modeset=1 nouveau.modeset=1 i915.modeset=1 amdgpu.dc=1 ibt=off loglevel=4 systemd.show_status=true vt.global_cursor_default=1 systemd.gpt_auto=0 rd.systemd.gpt_auto=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
