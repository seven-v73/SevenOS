# SevenOS keeps the BIOS boot path intentionally plain and readable.
# Some firmware/GPU combinations render vesamenu backgrounds with invisible
# labels, leaving users with an apparently empty boot screen. The text menu is
# less decorative, but it is the safest public ISO route.
SERIAL 0 115200
UI menu.c32
PROMPT 0
MENU TITLE SevenOS Boot Menu

MENU WIDTH 76
MENU MARGIN 4
MENU ROWS 10
MENU VSHIFT 4
MENU TABMSGROW 17
MENU CMDLINEROW 17
MENU HELPMSGROW 19
MENU HELPMSGENDROW 29

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32

MENU COLOR screen       37;40   #ffffffff #00000000 none
MENU COLOR border       37;40   #ffffffff #00000000 none
MENU COLOR title        1;37;40 #ffffffff #00000000 none
MENU COLOR sel          7;37;40 #ff000000 #ffffffff all
MENU COLOR unsel        37;40   #ffffffff #00000000 none
MENU COLOR help         37;40   #ffffffff #00000000 none
MENU COLOR timeout_msg  37;40   #ffffffff #00000000 none
MENU COLOR timeout      1;37;40 #ffffffff #00000000 none
MENU COLOR msg07        37;40   #ffffffff #00000000 none
MENU COLOR tabmsg       37;40   #ffffffff #00000000 none
