# =====================================================
# Seven Smart Window System
# =====================================================
#
# User-facing window behavior lives in `seven-window`.
#
# This file only keeps Hyprland placement and visual
# behavior aligned with the SevenOS window model.
#
# SevenEffects:
#   - Glass for system surfaces
#   - Depth through controlled blur
#   - Sharp rendering for applications
#   - No visual interference with application content
#
# =====================================================


# -----------------------------------------------------
# SYSTEM SURFACES
# -----------------------------------------------------
#
# SevenOS system surfaces may use blur to create the
# glass/depth effect.
#
# The blur is intentionally limited to system layers.
#

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace swaync-notification-window


# -----------------------------------------------------
# APPLICATION RENDERING
# -----------------------------------------------------
#
# Applications keep their own rendering sharp.
#
# SevenOS should not blur application content by default.
# This preserves readability, performance and application
# visual identity.
#


# ---- Development -------------------------------------

windowrule = no_blur on, match:class ^(code)$


# ---- Browsers ----------------------------------------

windowrule = no_blur on, match:class ^(firefox)$
windowrule = no_blur on, match:class ^(chromium)$


# ---- Communication ----------------------------------

windowrule = no_blur on, match:class ^(discord)$


# ---- Media -------------------------------------------

windowrule = no_blur on, match:class ^(spotify)$
windowrule = no_blur on, match:class ^(steam)$


# ---- Knowledge / Productivity -----------------------

windowrule = no_blur on, match:class ^(obsidian)$


# -----------------------------------------------------
# SEVEN WINDOW MODEL
# -----------------------------------------------------
#
# Do not add user-facing placement logic here.
#
# `seven-window` is responsible for:
#
#   - Smart placement
#   - Workspace behavior
#   - Focus behavior
#   - Floating decisions
#   - Window relationships
#
# Hyprland remains the rendering/compositor layer.
#
# =====================================================